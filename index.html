<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT SYRIA - لوحة التحكم الإدارية</title>
    <!-- مكتبات Firebase اللحظية -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color: #090d16; --card-bg: #151f32; --text: #f8fafc; --accent: #2563eb; --success: #16a34a; --danger: #dc2626; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 15px; direction: rtl; }
        .header { background: var(--card-bg); padding: 15px; border-radius: 14px; text-align: center; font-weight: bold; font-size: 20px; border: 1px solid #1e293b; margin-bottom: 20px; color: #60a5fa; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .card { background: var(--card-bg); padding: 16px; border-radius: 14px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .card-title { font-weight: bold; font-size: 16px; margin-bottom: 12px; color: #fbbf24; }
        .form-control { width: 100%; padding: 10px; margin: 8px 0; background: #0b1120; border: 1px solid #334155; border-radius: 8px; color: #fff; box-sizing: border-box; }
        .btn { padding: 10px 15px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .proof-img { width: 100%; max-height: 250px; object-fit: contain; border-radius: 8px; background: #000; margin: 8px 0; border: 1px solid #334155; }
        .action-btns { display: flex; gap: 8px; margin-top: 8px; }
        .action-btns button { flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <span>⚙️ لوحة إدارة البوت المركزية (الأدمن)</span>
    </div>

    <!-- 1. نشر مهمة جديدة -->
    <div class="card">
        <div class="card-title">➕ نشر مهمة جديدة فوراً لجميع المستخدمين</div>
        <input type="text" id="task-title" class="form-control" placeholder="عنوان المهمة (مثلاً: اشترك بالقناة)">
        <input type="text" id="task-desc" class="form-control" placeholder="الوصف والتعليمات">
        <input type="text" id="task-link" class="form-control" placeholder="رابط المهمة المباشر">
        <div style="display:flex; gap:10px;">
            <input type="number" id="task-seats" class="form-control" placeholder="عدد المقاعد المطلوبة">
            <input type="number" id="task-reward" class="form-control" placeholder="المكافأة (ل.س)">
        </div>
        <button class="btn btn-success" style="width:100%; margin-top:10px;" onclick="addNewTask()">🚀 نشر المهمة اللحظية</button>
    </div>

    <!-- 2. مراجعة الإثباتات -->
    <div class="card">
        <div class="card-title">📸 الإثباتات المعلقة بانتظار الموافقة</div>
        <div id="proofs-container" class="grid">جاري التحميل...</div>
    </div>

    <!-- 3. مراجعة طلبات السحب -->
    <div class="card">
        <div class="card-title">💸 طلبات سحب الأرباح المعلقة</div>
        <div id="withdrawals-container" class="grid">جاري التحميل...</div>
    </div>

    <!-- 4. إنشاء كود ترويجي -->
    <div class="card">
        <div class="card-title">🎁 إنشاء كود ترويجي جديد</div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="promo-code" class="form-control" placeholder="الكود (مثال: SYRIA2026)">
            <input type="number" id="promo-points" class="form-control" placeholder="النقاط">
            <input type="number" id="promo-seats" class="form-control" placeholder="المقاعد">
        </div>
        <button class="btn" style="width:100%; margin-top:8px;" onclick="addPromoCode()">حفظ الكود الترويجي</button>
    </div>

    <!-- 5. إدارة الحظر -->
    <div class="card">
        <div class="card-title">🚫 إدارة وحظر المستخدمين</div>
        <input type="text" id="ban-user-id" class="form-control" placeholder="معرف المستخدم (User ID)">
        <div class="action-btns">
            <button class="btn btn-danger" onclick="toggleBan(true)">حظر المستخدم</button>
            <button class="btn btn-success" onclick="toggleBan(false)">إلغاء الحظر</button>
        </div>
    </div>

    <!-- 6. الدعم الفني -->
    <div class="card">
        <div class="card-title">💬 رسائل الدعم الفني المعلقة</div>
        <div id="support-container" class="grid">جاري التحميل...</div>
    </div>

<script>
    // ⚙️ إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyD4EFPpYoKA0z-Jh5EaT-JmyJP-tAJKP9M",
        authDomain: "bot-syria.firebaseapp.com",
        databaseURL: "https://bot-syria-default-rtdb.firebaseio.com",
        projectId: "bot-syria",
        storageBucket: "bot-syria.firebasestorage.app",
        messagingSenderId: "865938637842",
        appId: "1:865938637842:web:cab563389cbb1d455084cb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ➕ نشر مهمة جديدة
    async function addNewTask() {
        const title = document.getElementById('task-title').value.trim();
        const desc = document.getElementById('task-desc').value.trim();
        const link = document.getElementById('task-link').value.trim();
        const seats = parseInt(document.getElementById('task-seats').value);
        const reward = parseInt(document.getElementById('task-reward').value);

        if (!title || !link || !seats || !reward) return alert('أكمل جميع البيانات بشكل صحيح!');

        const newTaskRef = db.ref('tasks').push();
        await newTaskRef.set({
            title: title,
            desc: desc,
            link: link,
            maxSeats: seats,
            completedSeats: 0,
            reward: reward,
            createdAt: Date.now()
        });

        alert('✅ تم نشر المهمة فوراً وقراءتها عبر كافة أجهزة المستخدمين!');
        document.getElementById('task-title').value = '';
        document.getElementById('task-desc').value = '';
        document.getElementById('task-link').value = '';
    }

    // 📸 مراقبة الإثباتات
    db.ref('proofs').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
        const container = document.getElementById('proofs-container');
        const proofs = snapshot.val();

        if (!proofs) {
            container.innerHTML = '<div style="color:#94a3b8;">لا توجد إثباتات معلقة حالياً.</div>';
            return;
        }

        let html = '';
        Object.keys(proofs).forEach(id => {
            const p = proofs[id];
            html += `
                <div style="background:#0b1120; padding:12px; border-radius:8px; border:1px solid #334155;">
                    <div><strong>المستخدم:</strong> ${p.userId}</div>
                    <div><strong>المهمة:</strong> ${p.taskTitle} (+${p.reward} ل.س)</div>
                    <img src="${p.imgUrl}" class="proof-img">
                    <div class="action-btns">
                        <button class="btn btn-success" onclick="handleProof('${id}', '${p.userId}', ${p.reward}, '${p.taskId}', true)">✅ قبول</button>
                        <button class="btn btn-danger" onclick="handleProof('${id}', '${p.userId}', ${p.reward}, '${p.taskId}', false)">❌ رفض</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    });

    // ⚖️ قبول / رفض الإثبات
    async function handleProof(proofId, userId, reward, taskId, approve) {
        if (approve) {
            const uSnap = await db.ref(`users/${userId}/balance`).once('value');
            const currentBal = uSnap.val() || 0;
            await db.ref(`users/${userId}/balance`).set(currentBal + reward);

            const tSnap = await db.ref(`tasks/${taskId}/completedSeats`).once('value');
            const currentSeats = tSnap.val() || 0;
            await db.ref(`tasks/${taskId}/completedSeats`).set(currentSeats + 1);

            await db.ref(`proofs/${proofId}/status`).set('approved');
            alert('✅ تم قبول الإثبات وإضافة الرصيد!');
        } else {
            await db.ref(`proofs/${proofId}/status`).set('rejected');
            alert('❌ تم رفض الإثبات.');
        }
    }

    // 💸 مراقبة طلبات السحب
    db.ref('withdrawals').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
        const container = document.getElementById('withdrawals-container');
        const data = snapshot.val();

        if (!data) {
            container.innerHTML = '<div style="color:#94a3b8;">لا توجد طلبات سحب معلقة.</div>';
            return;
        }

        let html = '';
        Object.keys(data).forEach(id => {
            const w = data[id];
            html += `
                <div style="background:#0b1120; padding:12px; border-radius:8px; border:1px solid #334155;">
                    <div><strong>المستخدم:</strong> ${w.userId}</div>
                    <div><strong>المبلغ:</strong> ${(w.amount || 0).toLocaleString()} ل.س</div>
                    <div><strong>الطريقة:</strong> ${w.method}</div>
                    <div><strong>الحساب:</strong> ${w.account}</div>
                    <div class="action-btns">
                        <button class="btn btn-success" onclick="handleWithdraw('${id}', '${w.userId}', ${w.amount}, true)">✅ تم التحويل</button>
                        <button class="btn btn-danger" onclick="handleWithdraw('${id}', '${w.userId}', ${w.amount}, false)">❌ رفض وإعادة الرصيد</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    });

    async function handleWithdraw(withdrawId, userId, amount, approve) {
        if (approve) {
            await db.ref(`withdrawals/${withdrawId}/status`).set('approved');
            alert('✅ تم تأكيد السحب بنجاح!');
        } else {
            const uSnap = await db.ref(`users/${userId}/balance`).once('value');
            const currentBal = uSnap.val() || 0;
            await db.ref(`users/${userId}/balance`).set(currentBal + amount);
            await db.ref(`withdrawals/${withdrawId}/status`).set('rejected');
            alert('❌ تم رفض السحب وإعادة الرصيد للمستخدم!');
        }
    }

    // 🎁 إضافة كود ترويجي
    async function addPromoCode() {
        const code = document.getElementById('promo-code').value.trim();
        const points = parseInt(document.getElementById('promo-points').value);
        const seats = parseInt(document.getElementById('promo-seats').value);

        if (!code || !points || !seats) return alert('يرجى كتابة كافة البيانات');

        await db.ref(`promos/${code}`).set({
            points: points,
            maxSeats: seats,
            usedSeats: 0
        });

        alert('✅ تم إنشاء الكود الترويجي بنجاح!');
    }

    // 🚫 حظر / إلغاء حظر
    async function toggleBan(isBan) {
        const userId = document.getElementById('ban-user-id').value.trim();
        if (!userId) return alert('أدخل ID المستخدم');

        const banTime = isBan ? Date.now() + (365 * 24 * 60 * 60 * 1000) : 0;
        await db.ref(`users/${userId}/bannedUntil`).set(banTime);

        alert(isBan ? '🚫 تم حظر المستخدم!' : '✅ تم إلغاء حظر المستخدم!');
    }

    // 💬 مراقبة الدعم
    db.ref('support').orderByChild('status').equalTo('pending').on('value', (snapshot) => {
        const container = document.getElementById('support-container');
        const data = snapshot.val();

        if (!data) {
            container.innerHTML = '<div style="color:#94a3b8;">لا توجد رسائل دعم معلقة.</div>';
            return;
        }

        let html = '';
        Object.keys(data).forEach(id => {
            const msg = data[id];
            html += `
                <div style="background:#0b1120; padding:12px; border-radius:8px; border:1px solid #334155;">
                    <div><strong>المستخدم:</strong> ${msg.userId}</div>
                    <div style="margin:5px 0;"><strong>الرسالة:</strong> ${msg.message}</div>
                    <input type="text" id="reply-${id}" class="form-control" placeholder="اكتب ردك هنا...">
                    <button class="btn btn-success" style="width:100%;" onclick="sendSupportReply('${id}')">إرسال الرد</button>
                </div>
            `;
        });
        container.innerHTML = html;
    });

    async function sendSupportReply(id) {
        const replyText = document.getElementById(`reply-${id}`).value.trim();
        if (!replyText) return alert('اكتب الرد أولاً');

        await db.ref(`support/${id}`).update({
            reply: replyText,
            status: 'replied'
        });

        alert('✅ تم إرسال الرد بنجاح!');
    }
</script>
</body>
</html>
